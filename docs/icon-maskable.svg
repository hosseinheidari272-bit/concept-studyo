<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#04070d" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone clipping on Android -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Outer Ambient Glow within safe-zone -->
  <circle cx="256" cy="256" r="140" fill="#00e5ff" opacity="0.14" filter="url(#glow)" />

  <!-- Centered Layered Crest scaled to fit inside the 80% circle safe-zone -->
  <g transform="translate(256, 256) scale(11.5)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polygon points="0 -10 -10 -5 0 0 10 -5" fill="url(#neonCyan)" fill-opacity="0.3" stroke="url(#neonCyan)" stroke-width="1.8" />
    <polyline points="-10 0 0 5 10 0" fill="none" stroke="url(#neonCyan)" stroke-width="1.8" />
    <polyline points="-10 5 0 10 10 5" fill="none" stroke="url(#goldAccent)" stroke-width="1.8" />
  </g>
</svg>
