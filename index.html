    <!-- بوت‌لودر هوشمند: اگر سایت بدون بیلد مستقیم از شاخه اصلی گیت‌هاب (main / root) اجرا شود، به صورت خودکار فایل‌های کامپایل‌شده داخل پوشه dist را بارگذاری می‌کند -->
    <script>
      window.__bootPrebuiltBundle = function () {
        if (
          window.__CONCEPT_STUDIO_MOUNTED__ ||
          window.__CONCEPT_BOOT_TRIGGERED__ ||
          document.querySelector('script[src*="@vite/client"]') ||
          document.querySelector('script[src*="assets/app.js"]')
        ) {
          return;
        }
        window.__CONCEPT_BOOT_TRIGGERED__ = true;
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './dist/assets/app.css';
        document.head.appendChild(link);

        var script = document.createElement('script');
        script.type = 'module';
        script.src = './dist/assets/app.js';
        document.body.appendChild(script);
      };
      window.addEventListener('DOMContentLoaded', function () {
        if (
          !document.querySelector('script[src*="@vite/client"]') &&
          !document.querySelector('script[src*="assets/app.js"]')
        ) {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (!window.__CONCEPT_STUDIO_MOUNTED__ && root && root.children.length === 0) {
              window.__bootPrebuiltBundle();
            }
          }, 400);
        }
      });
    </script>
