<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#060c18" />
      <stop offset="100%" stop-color="#04070d" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#00e5ff" opacity="0.12" filter="url(#glow)" />

  <!-- Isometric Layered Crest (Concept Studio Icon) -->
  <g transform="translate(256, 256) scale(15)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Top Rhombus -->
    <polygon points="0 -10 -10 -5 0 0 10 -5" fill="url(#neonCyan)" fill-opacity="0.25" stroke="url(#neonCyan)" stroke-width="1.8" />
    <!-- Middle Shelf -->
    <polyline points="-10 0 0 5 10 0" fill="none" stroke="url(#neonCyan)" stroke-width="1.8" />
    <!-- Bottom Shelf -->
    <polyline points="-10 5 0 10 10 5" fill="none" stroke="url(#goldAccent)" stroke-width="1.8" />
  </g>
</svg>
